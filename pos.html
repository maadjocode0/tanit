<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanit | POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="pos.css" />
</head>
<body class="pos-body">

  <div class="pos-shell">
    <div class="pos-topbar">
      <div class="pos-brand">
        <strong>Tanit Lounge</strong>
        <span>Dashboard commandes</span>
      </div>
      <div class="pos-right">
        <span id="orderCount" class="order-count">0 commande</span>
        <span id="currentTime" class="pos-time"></span>
      </div>
    </div>

    <div id="posOrders" class="pos-orders">
      <p class="empty-pos">Aucune commande en attente.</p>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script src="pos-script.js"></script>
</body>
</html>
